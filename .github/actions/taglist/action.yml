name: "git tag list"
description: "Obtain a list of git tag"
author: "tagoh"
inputs:
  token:
    description: "A GitHub Token"
    default: ''
  repository:
    description: "A Git repository"
    default: ''
  target:
    description: "A file to check a list of tags"
    required: true
  max_count:
    description: "A number of tags to output"
    default: '5'
  ref:
    description: "The branch, tag or SHA to checkout"
    default: ''
outputs:
  tags:
    description: "A list of git tags"
    value: ${{ steps.tags.outputs.value }}

runs:
  using: "composite"
  steps:
    - name: Checkout git repo
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repository }}
        token: ${{ inputs.token }}
        fetch-depth: 0
        ref: ${{ inputs.ref }}
    - name: Obtain a list of tags associated with a file
      id: tags
      run: |
        echo "value=$(.github/scripts/taglist.sh '${{ inputs.target }}' '${{ inputs.max_count }}')" >> $GITHUB_OUTPUT
      shell: bash
